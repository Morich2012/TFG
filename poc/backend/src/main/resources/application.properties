# PoC 2: relayer que envía a la blockchain las operaciones firmadas con la huella del hijo.
# Nodo RPC de Sepolia. El público funciona sin registro; con Infura/Alchemy: export SEPOLIA_RPC_URL=...
relayer.rpc-url=${SEPOLIA_RPC_URL:https://ethereum-sepolia-rpc.publicnode.com}
# Carpeta FUERA del repositorio donde se guardan la clave del relayer y la dirección del contrato.
relayer.data-dir=${RELAYER_DATA_DIR:${user.home}/.tfg-poc}
# Opcional: dirección de un DeviceKeyLedger ya desplegado (si no, POST /ledger/deploy).
relayer.contract-address=${DEVICE_LEDGER_ADDRESS:}
# Para que el móvil pueda llegar al backend por la wifi de casa.
server.address=0.0.0.0
