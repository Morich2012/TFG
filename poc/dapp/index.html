<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PoC MetaMask · TFG</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
      section { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
      h2 { margin-top: 0; font-size: 1.1rem; }
      button { margin: 0.25rem 0.25rem 0.25rem 0; }
      input { width: 100%; box-sizing: border-box; margin: 0.25rem 0; padding: 0.3rem; font-family: monospace; }
      code, pre { font-family: monospace; word-break: break-all; }
      #log { background: #111; color: #0f0; padding: 0.75rem; height: 260px; overflow: auto; white-space: pre-wrap; font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <h1>PoC MetaMask</h1>

    <section>
      <h2>Nivel 1 · Conexión</h2>
      <p>Wallet detectada: <code id="wallet">—</code></p>
      <p>Cuenta: <code id="account">—</code><br />Red: <code id="chain">—</code></p>
      <button id="connect">Conectar</button>
      <button id="disconnect">Desconectar</button>
      <button id="sepolia">Cambiar a Sepolia</button>
    </section>

    <section>
      <h2>Nivel 2 · Firma</h2>
      <button id="signLocal">Firmar y verificar en el navegador</button>
      <button id="signBackend">Login con backend (Spring Boot)</button>
    </section>

    <section>
      <h2>Nivel 3a · Transferencia de ETH de prueba</h2>
      <input id="to" placeholder="Dirección destino (0x...)" />
      <button id="send">Enviar 0.0001 SepoliaETH</button>
    </section>

    <section>
      <h2>Nivel 3b · Contrato FamilyLedger</h2>
      <button id="deploy">Desplegar FamilyLedger con la cuenta actual (será el padre)</button>
      <input id="contract" placeholder="Dirección del contrato desplegado (0x...)" />
      <input id="child" placeholder="Dirección del hijo (0x...)" />
      <input id="task" placeholder="Id de tarea (texto, p. ej. task-42)" />
      <button id="read">Leer estado</button>
      <button id="addChild">addChild (padre)</button>
      <button id="reward">reward 10 (padre)</button>
      <button id="spend">spend 3 (hijo)</button>
    </section>

    <pre id="log"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
